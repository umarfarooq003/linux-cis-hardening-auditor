[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-cis-hardening-auditor"
version = "1.0.0"
description = "CIS-inspired Linux security auditing and safe hardening assessment tool (audit-only by default)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Umar Farooq" }]
keywords = ["security", "hardening", "cis", "audit", "linux", "compliance", "blue-team"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.5",
    "typer>=0.9",
    "rich>=13.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.9",
    "mypy>=1.8",
    "types-PyYAML",
]

[project.scripts]
cis-auditor = "app.__main__:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["config/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "C4", "SIM"]
# E501: line length handled by formatter; B008: Typer uses Option() as a default;
# UP042: `str, Enum` is intentional (stable JSON/str behaviour on 3.11).
ignore = ["E501", "B008", "UP042"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
