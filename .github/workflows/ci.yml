name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Type check (mypy)
        run: mypy app || true   # advisory; does not fail the build yet

      - name: Tests
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Smoke test the CLI (read-only against a demo fixture)
        run: |
          python -m app version
          python -m app list-rules | tail -n +1 > /dev/null
          python scripts/demo.py /tmp/demo-reports
          test -f /tmp/demo-reports/demo_secure.html

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist/wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cis-auditor .
      - name: Run in-container audit (read-only)
        run: docker run --rm cis-auditor audit --quick --no-save --root / || true
