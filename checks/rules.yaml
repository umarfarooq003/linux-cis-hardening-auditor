    title: Legacy telnet server should be disabled
    category: services
    severity: MEDIUM
    benchmark_reference: "CIS-inspired: Special Purpose Services (telnet)"
    description: "The telnet server transmits credentials in cleartext and should be disabled if not required."
    check:
      type: service_status
      params: { service: telnet.socket, want: disabled, review: true }

  - rule_id: SVC-002
    title: Review avahi-daemon service
    category: services
    severity: LOW
    benchmark_reference: "CIS-inspired: Special Purpose Services (avahi)"
    description: "avahi-daemon (mDNS) is often unnecessary on servers -- review whether required."
    check:
      type: service_status
      params: { service: avahi-daemon.service, want: disabled, review: true }

  - rule_id: SVC-003
    title: Review CUPS printing service
    category: services
    severity: LOW
    benchmark_reference: "CIS-inspired: Special Purpose Services (cups)"
    description: "The CUPS print service is often unnecessary on servers -- review whether required."
    check:
      type: service_status
      params: { service: cups.service, want: disabled, review: true }

  - rule_id: SVC-004
    title: Review rpcbind service
    category: services
    severity: LOW
    benchmark_reference: "CIS-inspired: Special Purpose Services (rpcbind)"
    description: "rpcbind exposes RPC services and is often unnecessary -- review whether required."
    check:
      type: service_status
      params: { service: rpcbind.service, want: disabled, review: true }

  # ------------------------------------------------------------------
  # LOGGING & AUDITING
  # ------------------------------------------------------------------
  - rule_id: LOG-001
    title: Audit daemon (auditd) is enabled
    category: logging
    severity: MEDIUM
    benchmark_reference: "CIS-inspired: Logging and Auditing (auditd enabled)"
    description: "auditd should be installed and enabled to record security events."
    check:
      type: service_status
      params: { service: auditd.service, want: enabled }

  - rule_id: LOG-002
    title: Audit rules are defined
    category: logging
    severity: MEDIUM
    benchmark_reference: "CIS-inspired: Logging and Auditing (audit rules)"
    description: "Audit rules should be present so meaningful events are recorded."
    check:
      type: auditd_rule
      params: { mode: rules_present }

  - rule_id: LOG-003
    title: Authentication events are audited
    category: logging
    severity: LOW
    benchmark_reference: "CIS-inspired: Logging and Auditing (auth events)"
    description: "Audit rules should watch authentication-related files/events."
    check:
      type: auditd_rule
      params: { mode: auth_events }

  - rule_id: LOG-004
    title: Audit configuration is immutable
    category: logging
    severity: LOW
    benchmark_reference: "CIS-inspired: Logging and Auditing (immutable audit)"
    description: "Audit configuration should be made immutable (-e 2)."
    check:
      type: auditd_rule
      params: { mode: immutable }

  - rule_id: LOG-005
    title: System journald logging is active
    category: logging
    severity: LOW
    benchmark_reference: "CIS-inspired: Logging and Auditing (system logging)"
    description: "The systemd journal should be running to collect system logs."
    check:
      type: service_status
      params: { service: systemd-journald.service, want: active }

  - rule_id: LOG-006
    title: Secure /var/log directory permissions
    category: logging
    severity: LOW
    benchmark_reference: "CIS-inspired: Logging and Auditing (log permissions)"
    description: "/var/log should be root-owned and not world-writable (mode <= 0755)."
    check:
      type: file_permissions
      params: { path: /var/log, max_mode: "0755", owner: root }

  - rule_id: LOG-007
    title: Secure authentication log permissions
    category: logging
    severity: LOW
    benchmark_reference: "CIS-inspired: Logging and Auditing (auth log permissions)"
    description: "/var/log/auth.log, if present, must not be world-readable (mode <= 0640)."
    check:
      type: file_permissions
      params: { path: /var/log/auth.log, max_mode: "0640", must_exist: false }

  # ------------------------------------------------------------------
  # SUDO
  # ------------------------------------------------------------------
  - rule_id: SUDO-001
    title: Secure /etc/sudoers permissions
    category: sudo
    severity: MEDIUM
    benchmark_reference: "CIS-inspired: sudo Configuration (sudoers permissions)"
    description: "/etc/sudoers must be owned by root and mode <= 0440."
    check:
      type: sudoers
      params: { mode: perms }

  - rule_id: SUDO-002
    title: Secure /etc/sudoers.d directory permissions
    category: sudo
    severity: MEDIUM
    benchmark_reference: "CIS-inspired: sudo Configuration (sudoers.d permissions)"
    description: "/etc/sudoers.d should be root-owned and mode <= 0750."
    check:
      type: file_permissions
      params: { path: /etc/sudoers.d, max_mode: "0750", owner: root }

  - rule_id: SUDO-003
    title: Review sudo NOPASSWD directives
    category: sudo
    severity: MEDIUM
    benchmark_reference: "CIS-inspired: sudo Configuration (NOPASSWD)"
    description: "NOPASSWD directives grant passwordless privilege escalation and should be reviewed."
    check:
      type: sudoers
      params: { mode: nopasswd }

  - rule_id: SUDO-004
    title: Require a pty for sudo commands
    category: sudo
    severity: LOW
    benchmark_reference: "CIS-inspired: sudo Configuration (use_pty)"
    description: "'Defaults use_pty' should be configured to reduce session hijacking risk."
    check:
      type: sudoers
      params: { mode: use_pty }

  - rule_id: SUDO-005
    title: Review wildcard sudo command specifications
    category: sudo
    severity: LOW
    benchmark_reference: "CIS-inspired: sudo Configuration (wildcards)"
    description: "Wildcards in sudo command specifications can be dangerous and should be reviewed."
    check:
      type: sudoers
      params: { mode: wildcard }

  # ------------------------------------------------------------------
  # CRON / SCHEDULED TASKS
  # ------------------------------------------------------------------
  - rule_id: CRON-001
    title: Secure /etc/crontab permissions
    category: cron
    severity: LOW
    benchmark_reference: "CIS-inspired: Job Schedulers (crontab permissions)"
    description: "/etc/crontab should be root-owned and mode <= 0600."
    check:
      type: cron_permissions
      params: { path: /etc/crontab, max_mode: "0600", allow_missing: false }

  - rule_id: CRON-002
    title: Secure /etc/cron.d permissions
    category: cron
    severity: LOW
    benchmark_reference: "CIS-inspired: Job Schedulers (cron.d permissions)"
    description: "/etc/cron.d should be root-owned and mode <= 0700."
    check:
      type: cron_permissions
      params: { path: /etc/cron.d, max_mode: "0700" }

  - rule_id: CRON-003
    title: Restrict who can use cron (cron.allow)
    category: cron
    severity: LOW
    benchmark_reference: "CIS-inspired: Job Schedulers (cron.allow)"
    description: "cron.allow should exist to restrict which users may schedule cron jobs."
    check:
      type: cron_permissions
      params: { path: /etc/cron.allow, max_mode: "0640", access_file: true }

  - rule_id: CRON-004
    title: Restrict who can use at (at.allow)
    category: cron
    severity: LOW
    benchmark_reference: "CIS-inspired: Job Schedulers (at.allow)"
    description: "at.allow should exist to restrict which users may schedule at jobs."
    check:
      type: cron_permissions
      params: { path: /etc/at.allow, max_mode: "0640", access_file: true }
