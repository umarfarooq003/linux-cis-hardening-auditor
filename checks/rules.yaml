  # ------------------------------------------------------------------
  # FIREWALL
  # ------------------------------------------------------------------
  - rule_id: FW-001
    title: A host firewall is enabled
    category: firewall
    severity: HIGH
    benchmark_reference: "CIS-inspired: Host Based Firewall (firewall enabled)"
    description: "A host firewall (ufw/nftables/iptables) should be active."
    quick: true
    check:
      type: firewall
      params: { mode: active }

  - rule_id: FW-002
    title: Firewall default inbound policy is deny
    category: firewall
    severity: MEDIUM
    benchmark_reference: "CIS-inspired: Host Based Firewall (default deny)"
    description: "The default inbound firewall policy should be deny/drop."
    check:
      type: firewall
      params: { mode: default_deny }

  # ------------------------------------------------------------------
  # KERNEL / SYSTEM HARDENING (sysctl)
  # ------------------------------------------------------------------
  - rule_id: KRN-001
    title: Enable full address space layout randomization (ASLR)
    category: kernel
    severity: MEDIUM
    benchmark_reference: "CIS-inspired: Kernel Parameters (randomize_va_space)"
    description: "kernel.randomize_va_space should be 2 (full ASLR)."
    expected: { "kernel.randomize_va_space": "2" }
    check:
      type: sysctl
      params: { key: kernel.randomize_va_space, op: equals, expected: "2", unset_status: FAIL }
    remediation:
      supported: true
      requires_confirmation: true
      instructions: "Set kernel.randomize_va_space=2."
      action: { kind: sysctl, key: kernel.randomize_va_space, value: "2" }

  - rule_id: KRN-002
    title: Restrict kernel pointer exposure
    category: kernel
    severity: LOW
    benchmark_reference: "CIS-inspired: Kernel Parameters (kptr_restrict)"
    description: "kernel.kptr_restrict should be >= 1."
    expected: { "kernel.kptr_restrict": ">=1" }
    check:
      type: sysctl
      params: { key: kernel.kptr_restrict, op: gte, expected: "1", unset_status: WARN }
    remediation:
      supported: true
      requires_confirmation: true
      instructions: "Set kernel.kptr_restrict=1."
      action: { kind: sysctl, key: kernel.kptr_restrict, value: "1" }

  - rule_id: KRN-003
    title: Restrict access to kernel dmesg
    category: kernel
    severity: LOW
    benchmark_reference: "CIS-inspired: Kernel Parameters (dmesg_restrict)"
    description: "kernel.dmesg_restrict should be 1."
    expected: { "kernel.dmesg_restrict": "1" }
    check:
      type: sysctl
      params: { key: kernel.dmesg_restrict, op: equals, expected: "1", unset_status: WARN }
    remediation:
      supported: true
      requires_confirmation: true
      instructions: "Set kernel.dmesg_restrict=1."
      action: { kind: sysctl, key: kernel.dmesg_restrict, value: "1" }

  - rule_id: KRN-004
    title: Restrict ptrace scope
    category: kernel
    severity: LOW
    benchmark_reference: "CIS-inspired: Kernel Parameters (yama.ptrace_scope)"
    description: "kernel.yama.ptrace_scope should be >= 1."
    expected: { "kernel.yama.ptrace_scope": ">=1" }
    check:
      type: sysctl
      params: { key: kernel.yama.ptrace_scope, op: gte, expected: "1", unset_status: WARN }
    remediation:
      supported: true
      requires_confirmation: true
      instructions: "Set kernel.yama.ptrace_scope=1."
      action: { kind: sysctl, key: kernel.yama.ptrace_scope, value: "1" }

  - rule_id: KRN-005
