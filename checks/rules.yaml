  - rule_id: NET-001
    title: Disable IP forwarding
    category: network
    severity: MEDIUM
    benchmark_reference: "CIS-inspired: Network Parameters (ip_forward)"
    description: "IP forwarding should be disabled on hosts that are not routers."
    expected: { "net.ipv4.ip_forward": "0" }
    check:
      type: sysctl
      params: { key: net.ipv4.ip_forward, op: equals, expected: "0", unset_status: WARN }
    remediation:
      supported: true
      requires_confirmation: true
      instructions: "Set net.ipv4.ip_forward=0 (only if this host is not a router)."
      action: { kind: sysctl, key: net.ipv4.ip_forward, value: "0" }

